name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -B -ntp -f backend/pom.xml clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run component tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

  docker:
    name: Production Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WALLETWISE_SMOKE_EMAIL: api.smoke.${{ github.run_id }}@walletwise.test
      WALLETWISE_SMOKE_PASSWORD: Smoke@123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: walletwise-platform:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start production stack
        run: docker compose up --detach --no-build

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Run API smoke verification
        run: node scripts/verify-api.mjs

      - name: Restart application and verify persistence
        shell: bash
        run: |
          docker compose up --detach --no-deps --force-recreate app
          for attempt in {1..36}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent \
              http://localhost:8080/actuator/health >/dev/null && \
              node scripts/verify-persistence.mjs; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Verify browser test discovery
        working-directory: frontend
        timeout-minutes: 2
        run: npx playwright test --list

      - name: Run browser end-to-end tests
        working-directory: frontend
        timeout-minutes: 5
        run: npm run test:e2e

      - name: Capture verified demo screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: walletwise-screenshots
          path: docs/images/*.jpg
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Preserve browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: walletwise-browser-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            docs/images/*.jpg
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes
