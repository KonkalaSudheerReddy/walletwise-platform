server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletwise}
    username: ${SPRING_DATASOURCE_USERNAME:walletwise}
    password: ${SPRING_DATASOURCE_PASSWORD:walletwise_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: WalletWise
    description: Portfolio-quality digital wallet and expense management platform
    version: '@project.version@'

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    issuer: ${APP_JWT_ISSUER:walletwise}
    secret: ${JWT_SECRET:local-development-only-walletwise-secret-change-me-2026}
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:P7D}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-seed-enabled: ${APP_DEMO_SEED_ENABLED:false}
  idempotency-retention: ${APP_IDEMPOTENCY_RETENTION:P7D}
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}

---
spring:
  config:
    activate:
      on-profile: prod

app:
  cookie-secure: ${APP_COOKIE_SECURE:true}
